name: MidnightPass CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Compile Compact, Test & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Compact Compiler Toolchain
        run: |
          curl -sSL https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/compact update 0.31.1

      - name: Install Root Dependencies
        run: npm ci

      - name: Compile Compact Smart Contract (ZK Circuits)
        run: npm run compile

      - name: Run Vitest Unit & Simulator Suite
        run: npm run test

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
